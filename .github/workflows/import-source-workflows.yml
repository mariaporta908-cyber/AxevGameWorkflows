name: Import Source Workflows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-source-workflows
  cancel-in-progress: false

jobs:
  import:
    name: Import the two approved workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch, validate, and import workflows
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.WORKFLOW_IMPORT_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = "main";

            const sources = [
              {
                url: "https://raw.githubusercontent.com/Aurelhopedro/Axev3Ds/main/.github/workflows/ara-axev-crime.yml",
                path: ".github/workflows/ara-axev-crime.yml",
                message: "Import AXEV 3D character generation workflow"
              },
              {
                url: "https://raw.githubusercontent.com/Aurelhopedro/AxevCrime/main/.github/workflows/build-android.yml",
                path: ".github/workflows/build-android.yml",
                message: "Import AXEV Crime Android build workflow"
              }
            ];

            if (!process.env.GITHUB_TOKEN) {
              throw new Error("Missing WORKFLOW_IMPORT_TOKEN secret.");
            }

            for (const item of sources) {
              core.info(`Fetching ${item.url}`);
              const response = await fetch(item.url, {
                headers: { "User-Agent": "AxevGameWorkflows-importer" }
              });
              if (!response.ok) {
                throw new Error(`Source download failed (${response.status}): ${item.url}`);
              }

              const sourceText = await response.text();
              if (!sourceText.trim() || !sourceText.includes("name:")) {
                throw new Error(`Downloaded content failed basic YAML validation: ${item.path}`);
              }

              let existingSha;
              try {
                const existing = await github.rest.repos.getContent({
                  owner, repo, path: item.path, ref: branch
                });
                if (Array.isArray(existing.data) || typeof existing.data.content !== "string") {
                  throw new Error(`Destination path is not a normal file: ${item.path}`);
                }
                const existingText = Buffer.from(
                  existing.data.content.replace(/\n/g, ""), "base64"
                ).toString("utf8");
                if (existingText === sourceText) {
                  core.info(`Already up to date: ${item.path}`);
                  continue;
                }
                existingSha = existing.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: item.path,
                message: item.message,
                content: Buffer.from(sourceText, "utf8").toString("base64"),
                branch,
                ...(existingSha ? { sha: existingSha } : {})
              });
              core.info(`Imported: ${item.path}`);
            }

            core.notice("Both source workflow imports have been processed. This importer does not run either imported workflow.");
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_IMPORT_TOKEN }}
